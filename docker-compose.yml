services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: finadvisor-postgres
    environment:
      POSTGRES_DB: finadvisor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finadvisor-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: finadvisor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finadvisor-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finadvisor-backend
    environment:
      # Database Configuration (connects to postgres service)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finadvisor
      DB_USER: postgres
      DB_PASSWORD: postgres

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Model Configuration (uses OpenAI for local dev, Bedrock for AWS)
      MODEL_PROVIDER: openai
      MODEL_NAME: gpt-4o-mini
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_DEBUG: true
      API_TIMEOUT: 180

      # RAG Configuration
      RAG_ENABLED: true
      RAG_EMBEDDING_DIM: 384
      RAG_SIMILARITY_THRESHOLD: 0.3

      # Logging
      LOG_LEVEL: INFO

      # Optional: Anthropic API Key (from .env file)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Optional: AWS Bedrock (from .env file)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./config.json:/app/config.json
    networks:
      - finadvisor-network

  # Frontend (Streamlit)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finadvisor-frontend
    environment:
      # API Endpoint (connects to backend service)
      API_ENDPOINT: http://backend:8000
      API_TIMEOUT: 180

      # Streamlit Configuration
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_HEADLESS: true
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - finadvisor-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  finadvisor-network:
    driver: bridge
